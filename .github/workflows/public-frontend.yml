name: Publish Public Frontend

on:
  workflow_dispatch:
    inputs:
      public_host:
        description: Owned public converter hostname
        required: true
        default: agenticconverter.tech
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: public-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Hostname and Image Name
        id: target
        env:
          PUBLIC_HOST: ${{ inputs.public_host }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node -e 'const host = process.env.PUBLIC_HOST; if (!/^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/.test(host) || host.length > 253) process.exit(1);'
          echo "image=ghcr.io/${REPOSITORY,,}-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.target.outputs.image }}:public-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_API_URL=https://${{ inputs.public_host }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend-public
