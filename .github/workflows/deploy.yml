name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Frontend Dependencies, Test & Build
        run: |
          cd apps/frontend
          npm install --legacy-peer-deps
          npx vitest run
          npm run build

      - name: Install Backend Dependencies, Test & Build
        run: |
          cd apps/backend
          npm install --legacy-peer-deps
          npx prisma generate
          npm run test
          npm run build

      - name: Install Worker Dependencies & Test
        run: |
          cd apps/worker
          pip install -r requirements.txt
          pytest

  # In a complete setup, this step would build Docker images, 
  # push to ECR/DockerHub, and trigger Terraform/Kubernetes apply.
  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Images
        run: |
          docker compose build
