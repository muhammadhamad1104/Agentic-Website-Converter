services:
  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: [demo]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    volumes:
      - mailpit_data:/data

  stripe-listener:
    image: stripe/stripe-cli:v1.53.1
    profiles: [demo]
    restart: unless-stopped
    dns:
      - ${APP_DNS_PRIMARY:-1.1.1.1}
      - ${APP_DNS_SECONDARY:-8.8.8.8}
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_DEVICE_NAME: agentic-converter-local
    command: listen --events payment_intent.succeeded --forward-to http://backend:5000/api/payments/webhook

  db:
    image: postgres:15-alpine
    container_name: agentic_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-agentic_converter}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentic_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    pull_policy: build
    dns:
      - ${APP_DNS_PRIMARY:-1.1.1.1}
      - ${APP_DNS_SECONDARY:-8.8.8.8}
    build: 
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: agentic_backend
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=5000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-agentic_converter}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?Run node scripts/prepare-env.mjs first}
      - WORKER_API_URL=http://worker:8000
      - PREVIEW_API_SECRET=${PREVIEW_API_SECRET}
      - PREVIEW_PORT=5001
      - PREVIEW_PUBLIC_URL=${PREVIEW_PUBLIC_URL:-}
      - CORS_ORIGIN=${FRONTEND_URL:-http://localhost:5173}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_ALLOW_INSECURE_LOCAL=${SMTP_ALLOW_INSECURE_LOCAL:-false}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME:-Administrator}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    command: node dist/server.js
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health', { signal: AbortSignal.timeout(5000) }).then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 6

  worker:
    pull_policy: build
    dns:
      - ${APP_DNS_PRIMARY:-1.1.1.1}
      - ${APP_DNS_SECONDARY:-8.8.8.8}
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: agentic_worker
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PREVIEW_API_SECRET=${PREVIEW_API_SECRET}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-agentic_converter}
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_REQUEST_TIMEOUT_SECONDS=${LLM_REQUEST_TIMEOUT_SECONDS:-60}
      - LLM_SCHEMA_CONCURRENCY=${LLM_SCHEMA_CONCURRENCY:-2}
      - LLM_SCHEMA_BATCH_CHARS=${LLM_SCHEMA_BATCH_CHARS:-12000}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - KIMI_MODEL=${KIMI_MODEL}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - OPEN_SOURCE_API_KEY=${OPEN_SOURCE_API_KEY}
      - OPEN_SOURCE_MODEL=${OPEN_SOURCE_MODEL}
      - OPEN_SOURCE_BASE_URL=${OPEN_SOURCE_BASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/worker/src:/app/src
      - ./apps/worker/generate_same_project.py:/app/generate_same_project.py
      - ./apps/worker/data:/app/data
      - ./apps/worker/generated:/app/generated
      - ./apps/worker/data/crawl-cache:/tmp/py_agent_crawl_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 60s
      retries: 6

  frontend:
    pull_policy: build
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY:-}
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    container_name: agentic_frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
